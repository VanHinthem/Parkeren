# Standalone acceptance environment for UGREEN NAS.
# Run from this directory with docker compose up -d.

services:
  app:
    image: ghcr.io/vanhinthem/parkeren-app:${PARKEREN_ACC_IMAGE_TAG:-acc}
    restart: unless-stopped
    ports:
      - "${PARKEREN_APP_PORT:-5082}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Parkeren: Host=db;Port=5432;Database=parkeren_acc;Username=parkeren;Password=${PARKEREN_DB_PASSWORD:?Set PARKEREN_DB_PASSWORD}
      ParkingProvider__Type: TwoParkMock
      ParkingProvider__BaseUrl: http://two-park-mock:8080
      Notifications__RetentionDays: ${PARKEREN_NOTIFICATION_RETENTION_DAYS:-90}
      WebPush__Subject: ${PARKEREN_WEBPUSH_SUBJECT:-}
      WebPush__PublicKey: ${PARKEREN_WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${PARKEREN_WEBPUSH_PRIVATE_KEY:-}
      BootstrapAdmin__Username: ${PARKEREN_BOOTSTRAP_ADMIN_USERNAME:-}
      BootstrapAdmin__Pin: ${PARKEREN_BOOTSTRAP_ADMIN_PIN:-}
    depends_on:
      db:
        condition: service_healthy
      two-park-mock:
        condition: service_started

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkeren_acc
      POSTGRES_USER: parkeren
      POSTGRES_PASSWORD: ${PARKEREN_DB_PASSWORD:?Set PARKEREN_DB_PASSWORD}
    volumes:
      - parkeren_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkeren -d parkeren_acc"]
      interval: 10s
      timeout: 5s
      retries: 5

  two-park-mock:
    image: ghcr.io/vanhinthem/parkeren-two-park-mock:${PARKEREN_ACC_IMAGE_TAG:-acc}
    restart: unless-stopped
    environment:
      TwoParkMock__StatePath: /data/actions.json
    volumes:
      - two_park_mock_data:/data

volumes:
  parkeren_db:
  two_park_mock_data:
