name: Temp G8 scheduled capacity patch

on:
  push:
    branches:
      - scratch/g8-scheduled-capacity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/g8-scheduled-capacity
      - name: Apply G8 patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          program_path = Path("src/Parkeren.TwoParkMock/Program.cs")
          program = program_path.read_text()

          program = replace_once(
              program,
              "}\n\nvar maxConcurrentActions = 5;\n",
              "}\n\nstatic bool ConsumesCapacity(\n    MockParkingAction action,\n    DateTimeOffset now,\n    bool countScheduledTowardCapacity,\n    MockPostEndBehavior postEndBehavior)\n{\n    if (string.Equals(action.Status, \"stopped\", StringComparison.OrdinalIgnoreCase))\n        return false;\n\n    if (now < action.Start)\n        return countScheduledTowardCapacity;\n\n    if (now < action.End)\n        return true;\n\n    return postEndBehavior == MockPostEndBehavior.KeepActive;\n}\n\nvar maxConcurrentActions = 5;\nvar countScheduledTowardCapacity = false;\n",
              "capacity helper anchor")

          program = replace_once(
              program,
              "    if (actions.Values.Count(x => x.Status == \"active\" && x.End > mockClock.UtcNow) >= maxConcurrentActions)\n        return Results.Conflict(new { error = \"Provider capacity reached.\" });\n",
              "    var capacityNow = mockClock.UtcNow;\n    if (actions.Values.Count(x => ConsumesCapacity(x, capacityNow, countScheduledTowardCapacity, postEndBehavior)) >= maxConcurrentActions)\n        return Results.Conflict(new { error = \"Provider capacity reached.\" });\n",
              "capacity check")

          program = replace_once(
              program,
              "app.MapPost(\"/api/test/capacity\", (MockCapacityRequest request) =>\n{\n    maxConcurrentActions = Math.Max(1, request.MaxConcurrentActions);\n    return Results.NoContent();\n});\n",
              "app.MapPost(\"/api/test/capacity\", (MockCapacityRequest request) =>\n{\n    maxConcurrentActions = Math.Max(1, request.MaxConcurrentActions);\n    countScheduledTowardCapacity = request.CountScheduled;\n    return Results.NoContent();\n});\n",
              "capacity endpoint")

          program = replace_once(
              program,
              "    maxConcurrentActions = 5;\n    maxActionDuration = TimeSpan.FromHours(4);\n",
              "    maxConcurrentActions = 5;\n    countScheduledTowardCapacity = false;\n    maxActionDuration = TimeSpan.FromHours(4);\n",
              "capacity reset")

          program = replace_once(
              program,
              "public sealed record MockCapacityRequest(int MaxConcurrentActions);\n",
              "public sealed record MockCapacityRequest(int MaxConcurrentActions, bool CountScheduled = false);\n",
              "capacity request")

          program_path.write_text(program)

          test_path = Path("tests/Parkeren.IntegrationTests/ParkingProviderMockTests.cs")
          tests = test_path.read_text()
          test_anchor = "    [Fact]\n    public async Task Mock_state_can_be_reset_between_scenarios()\n"
          test_block = """    [Fact]
    public async Task Mock_capacity_can_configure_scheduled_actions_and_uses_clock_activation()
    {
        await using var factory = new WebApplicationFactory<Parkeren.TwoParkMock.Program>();
        using var http = factory.CreateClient();
        var cancellationToken = TestContext.Current.CancellationToken;
        var now = new DateTimeOffset(2026, 10, 2, 12, 0, 0, TimeSpan.Zero);

        (await http.PostAsync("api/test/reset", null, cancellationToken)).EnsureSuccessStatusCode();
        (await http.PostAsJsonAsync("api/test/clock/set", new { UtcNow = now }, cancellationToken)).EnsureSuccessStatusCode();
        (await http.PostAsJsonAsync("api/test/capacity", new { MaxConcurrentActions = 1, CountScheduled = false }, cancellationToken)).EnsureSuccessStatusCode();

        var provider = new TwoParkMockProvider(http);
        await provider.StartActionAsync(
            new ProviderParkingActionRequest("CAPSCH1", now.AddMinutes(10), now.AddMinutes(40), "Oss"), cancellationToken);
        await provider.StartActionAsync(
            new ProviderParkingActionRequest("CAPSCH2", now.AddMinutes(20), now.AddMinutes(50), "Oss"), cancellationToken);

        (await http.PostAsJsonAsync("api/test/clock/advance", new { Milliseconds = 10 * 60 * 1000 }, cancellationToken)).EnsureSuccessStatusCode();
        await Assert.ThrowsAsync<HttpRequestException>(() => provider.StartActionAsync(
            new ProviderParkingActionRequest("CAPACTIVE", now.AddMinutes(10), now.AddMinutes(30), "Oss"), cancellationToken));

        (await http.PostAsync("api/test/reset", null, cancellationToken)).EnsureSuccessStatusCode();
        (await http.PostAsJsonAsync("api/test/clock/set", new { UtcNow = now }, cancellationToken)).EnsureSuccessStatusCode();
        (await http.PostAsJsonAsync("api/test/capacity", new { MaxConcurrentActions = 1, CountScheduled = true }, cancellationToken)).EnsureSuccessStatusCode();

        await provider.StartActionAsync(
            new ProviderParkingActionRequest("CAPSCH3", now.AddMinutes(10), now.AddMinutes(40), "Oss"), cancellationToken);
        await Assert.ThrowsAsync<HttpRequestException>(() => provider.StartActionAsync(
            new ProviderParkingActionRequest("CAPSCH4", now.AddMinutes(20), now.AddMinutes(50), "Oss"), cancellationToken));
    }

"""
          tests = replace_once(tests, test_anchor, test_block + test_anchor, "capacity test anchor")
          test_path.write_text(tests)

          progress_path = Path("docs/technisch/visit-scheduler-audit/PROGRESS.md")
          progress = progress_path.read_text()
          progress = replace_once(
              progress,
              "- 🚧 G7: expliciete post-End testmodi (`keep-active`, `completed`, `hide`) zonder default provideraanname.\n",
              "- ✅ G7: expliciete post-End testmodi (`keep-active`, `completed`, `hide`) zonder default provideraanname; CI groen op commit `80ebcf7a`.\n- 🚧 G8: provider-capaciteit wordt uit mockklok/state afgeleid en scheduled actions tellen alleen mee wanneer de test dit expliciet configureert.\n",
              "G7 progress")
          progress_path.write_text(progress)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Parkeren.TwoParkMock/Program.cs tests/Parkeren.IntegrationTests/ParkingProviderMockTests.cs docs/technisch/visit-scheduler-audit/PROGRESS.md
          git commit -m "temp: build g8 scheduled capacity patch"
          git push
