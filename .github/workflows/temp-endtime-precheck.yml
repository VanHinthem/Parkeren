name: temp endtime precheck patch

on:
  push:
    branches:
      - scratch/e5-endtime-precheck

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/e5-endtime-precheck
          fetch-depth: 0
      - name: Patch end-time precheck semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Parkeren.Infrastructure/Visits/PostgresVisitEndTimeChanger.cs')
          text = path.read_text()
          pattern = r'(var dueAt = currentAction is not null && nextPaid\.Start <= currentAction\.PlannedEndAt\s*\n\s*\? ProviderCoverageSchedule\.PrecheckAt\(currentAction\.PlannedEndAt\)\s*\n\s*:) nextPaid\.Start;'
          text, count = re.subn(pattern, r'\1 ProviderCoverageSchedule.PrecheckAt(nextPaid.Start);', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one end-time continuation dueAt block, found {count}')
          path.write_text(text)

          path = Path('docs/technisch/visit-scheduler-audit/PROGRESS.md')
          text = path.read_text()
          old = '- 🚧 `ProviderContinuationStartResultStore` plant na een bevestigde continuation-start een later betaald segment op T-5 van `nextPaid.Start`; aaneengesloten coverage blijft T-5 van de huidige provider-end.'
          new = '- ✅ `ProviderContinuationStartResultStore` plant na een bevestigde continuation-start een later betaald segment op T-5 van `nextPaid.Start`; aaneengesloten coverage blijft T-5 van de huidige provider-end; CI groen op commit `d75e0e6b` (`fix: precheck paid window after continuation start`).\n- 🚧 `PostgresVisitEndTimeChanger` plant nieuw benodigde coverage na het verlengen van `DesiredEndAt` eveneens op T-5 van `nextPaid.Start`; aaneengesloten coverage blijft T-5 van de huidige provider-end.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Phase E continuation-progress line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- src/Parkeren.Infrastructure/Visits/PostgresVisitEndTimeChanger.cs docs/technisch/visit-scheduler-audit/PROGRESS.md
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Parkeren.Infrastructure/Visits/PostgresVisitEndTimeChanger.cs docs/technisch/visit-scheduler-audit/PROGRESS.md
          git commit -m 'fix: precheck paid window after end-time change'
          git push origin HEAD:scratch/e5-endtime-precheck
