name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/Parkeren.Api/**'
              - 'src/Parkeren.Application/**'
              - 'src/Parkeren.Domain/**'
              - 'src/Parkeren.Infrastructure/**'
              - 'src/Parkeren.TwoParkMock/**'
              - 'tests/Parkeren.Application.Tests/**'
              - 'tests/Parkeren.Domain.Tests/**'
              - 'tests/Parkeren.IntegrationTests/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'Directory.Packages.props'
              - 'compose*.yml'
              - '.github/workflows/**'
            frontend:
              - 'src/Parkeren.Web/**'
              - 'compose*.yml'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Parkeren.slnx
      - run: dotnet build Parkeren.slnx --no-restore --configuration Release
      - run: dotnet test Parkeren.slnx --no-build --configuration Release

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Parkeren.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npm test
