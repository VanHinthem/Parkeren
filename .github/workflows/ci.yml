name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Parkeren.slnx
      - run: dotnet build Parkeren.slnx --no-restore --configuration Release
      - name: Diagnose EF model drift
        run: |
          dotnet tool install --global dotnet-ef --version '10.0.*'
          dotnet ef migrations add DiagnoseModelDrift --project src/Parkeren.Infrastructure --startup-project src/Parkeren.Infrastructure --output-dir Persistence/Migrations/Diagnostic
          git diff -- src/Parkeren.Infrastructure/Persistence/Migrations/ParkerenDbContextModelSnapshot.cs
          exit 1
      - run: dotnet test Parkeren.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Parkeren.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npm test
