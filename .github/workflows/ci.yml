name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_acceptance_images:
        description: Publish acceptance images to GHCR
        required: false
        type: boolean
        default: false

jobs:
  changes:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/Parkeren.Api/**'
              - 'src/Parkeren.Application/**'
              - 'src/Parkeren.Domain/**'
              - 'src/Parkeren.Infrastructure/**'
              - 'src/Parkeren.TwoParkMock/**'
              - 'tests/Parkeren.Application.Tests/**'
              - 'tests/Parkeren.Domain.Tests/**'
              - 'tests/Parkeren.IntegrationTests/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'Directory.Packages.props'
              - 'compose*.yml'
              - 'deploy/compose*.yml'
              - '.github/workflows/**'
            frontend:
              - 'src/Parkeren.Web/**'
              - 'compose*.yml'
              - 'deploy/compose*.yml'
              - '.github/workflows/**'

  validate-nas-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone ACC and DEV Compose templates
        env:
          PARKEREN_DB_PASSWORD: ci-validation-placeholder
          PARKEREN_ACTIVE_BRANCH: feature/compose-validation
          PARKEREN_GIT_POLL_SECONDS: '15'
        run: |
          docker compose -f deploy/nas/acc/docker-compose.yml config --quiet
          docker compose -f deploy/nas/dev/docker-compose.yml config --quiet
      - name: Check DEV controller shell interpolation
        env:
          PARKEREN_DB_PASSWORD: ci-validation-placeholder
          PARKEREN_ACTIVE_BRANCH: feature/compose-validation
          PARKEREN_GIT_POLL_SECONDS: '15'
        run: |
          docker compose -f deploy/nas/dev/docker-compose.yml config --format json |
            python3 -c 'import json,sys; c=json.load(sys.stdin)["services"]["branch-controller"]["command"]; script="\n".join(c) if isinstance(c,list) else c; assert all(token in script for token in ("$branch","$interval","$(git ")), "controller shell variables were interpolated by Compose"'

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  backend:
    needs: changes
    if: >-
      always() && (
        needs.changes.outputs.backend == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Parkeren.slnx
      - run: dotnet build Parkeren.slnx --no-restore --configuration Release
      - run: dotnet test Parkeren.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
      - name: Publish backend test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Backend Tests
          path: '**/TestResults/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: false

  frontend:
    needs: changes
    if: >-
      always() && (
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: src/Parkeren.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - name: Build and check production PWA
        env:
          PARKEREN_BUILD_ID: ${{ github.sha }}
          PARKEREN_APP_VARIANT: production
        run: npm run build && npm run check:pwa
      - name: Build and check acceptance PWA
        env:
          PARKEREN_BUILD_ID: ${{ github.sha }}
          PARKEREN_APP_VARIANT: dev
        run: npm run build && npm run check:pwa
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Publish frontend test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Frontend Tests
          path: 'src/Parkeren.Web/test-results.xml'
          reporter: java-junit
          fail-on-error: false

  validate-release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi

  build-acceptance-images:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/develop' &&
          inputs.publish_acceptance_images
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true'
      ) &&
      needs.secret-scan.result == 'success' &&
      (
        (needs.changes.outputs.backend != 'true' && needs.backend.result == 'skipped') ||
        needs.backend.result == 'success'
      ) &&
      (
        (needs.changes.outputs.frontend != 'true' && needs.frontend.result == 'skipped') ||
        needs.frontend.result == 'success'
      )
    needs: [changes, backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build acceptance app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.Api/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-app:acc-${{ github.sha }}
            parkeren-app:acc
          build-args: |
            PARKEREN_BUILD_ID=${{ github.sha }}
            PARKEREN_APP_VERSION=dev
            PARKEREN_APP_VARIANT=acc
          labels: |
            org.opencontainers.image.source=https://github.com/VanHinthem/Parkeren
      - name: Build TwoPark mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.TwoParkMock/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-two-park-mock:acc-${{ github.sha }}
            parkeren-two-park-mock:acc
          labels: |
            org.opencontainers.image.source=https://github.com/VanHinthem/Parkeren
      - name: Verify development image tags
        run: |
          docker image inspect parkeren-app:acc-${GITHUB_SHA}
          docker image inspect parkeren-app:acc
          docker image inspect parkeren-two-park-mock:acc-${GITHUB_SHA}
          docker image inspect parkeren-two-park-mock:acc
      - name: Scan development app image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-app:acc-${{ github.sha }}
          scanners: secret
          format: json
          output: trivy-app-secrets.json
          exit-code: '1'
          hide-progress: true
      - name: Scan development app image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-app:acc-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
          hide-progress: true
      - name: Scan TwoPark mock image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-two-park-mock:acc-${{ github.sha }}
          scanners: secret
          format: json
          output: trivy-mock-secrets.json
          exit-code: '1'
          skip-setup-trivy: true
          hide-progress: true
      - name: Scan TwoPark mock image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-two-park-mock:acc-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
          hide-progress: true
      - name: Save scanned acceptance images
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/develop' &&
            inputs.publish_acceptance_images
          )
        run: |
          docker save -o dev-images.tar \
            parkeren-app:acc-${GITHUB_SHA} \
            parkeren-app:acc \
            parkeren-two-park-mock:acc-${GITHUB_SHA} \
            parkeren-two-park-mock:acc
      - name: Upload scanned acceptance images
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/develop' &&
            inputs.publish_acceptance_images
          )
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-images-${{ github.sha }}
          path: dev-images.tar
          compression-level: 0
          retention-days: 1

  publish-acceptance-images:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/develop' &&
        inputs.publish_acceptance_images
      )
    needs: [build-acceptance-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned acceptance images
        uses: actions/download-artifact@v4
        with:
          name: acceptance-images-${{ github.sha }}
      - name: Load scanned acceptance images
        run: docker load --input dev-images.tar
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish acceptance images
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag parkeren-app:acc-${IMAGE_SHA} ghcr.io/vanhinthem/parkeren-app:acc-${IMAGE_SHA}
          docker tag parkeren-app:acc ghcr.io/vanhinthem/parkeren-app:acc
          docker tag parkeren-two-park-mock:acc-${IMAGE_SHA} ghcr.io/vanhinthem/parkeren-two-park-mock:acc-${IMAGE_SHA}
          docker tag parkeren-two-park-mock:acc ghcr.io/vanhinthem/parkeren-two-park-mock:acc
          docker push ghcr.io/vanhinthem/parkeren-app:acc-${IMAGE_SHA}
          docker push ghcr.io/vanhinthem/parkeren-app:acc
          docker push ghcr.io/vanhinthem/parkeren-two-park-mock:acc-${IMAGE_SHA}
          docker push ghcr.io/vanhinthem/parkeren-two-park-mock:acc

  build-release-image:
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.validate-release-tag.result == 'success' &&
      needs.secret-scan.result == 'success'
    needs: [backend, frontend, validate-release-tag, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.Api/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-app:${{ github.ref_name }}
            parkeren-app:sha-${{ github.sha }}
          build-args: |
            PARKEREN_BUILD_ID=${{ github.sha }}
            PARKEREN_APP_VERSION=${{ github.ref_name }}
            PARKEREN_APP_VARIANT=production
          labels: |
            org.opencontainers.image.source=https://github.com/VanHinthem/Parkeren
      - name: Verify release image tags
        run: |
          docker image inspect parkeren-app:${GITHUB_REF_NAME}
          docker image inspect parkeren-app:sha-${GITHUB_SHA}
      - name: Scan release image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-app:${{ github.ref_name }}
          scanners: secret
          format: json
          output: trivy-release-secrets.json
          exit-code: '1'
          hide-progress: true
      - name: Scan release image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkeren-app:${{ github.ref_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
          hide-progress: true
      - name: Save scanned release image
        run: |
          docker save -o release-image.tar \
            parkeren-app:${GITHUB_REF_NAME} \
            parkeren-app:sha-${GITHUB_SHA}
      - name: Upload scanned release image
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.sha }}
          path: release-image.tar
          compression-level: 0
          retention-days: 1

  publish-release-image:
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-release-image.result == 'success'
    needs: [build-release-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned release image
        uses: actions/download-artifact@v4
        with:
          name: release-image-${{ github.sha }}
      - name: Load scanned release image
        run: docker load --input release-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish release image
        env:
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.ref_name }}
        run: |
          docker tag parkeren-app:${IMAGE_VERSION} ghcr.io/vanhinthem/parkeren-app:${IMAGE_VERSION}
          docker tag parkeren-app:sha-${IMAGE_SHA} ghcr.io/vanhinthem/parkeren-app:sha-${IMAGE_SHA}
          docker push ghcr.io/vanhinthem/parkeren-app:${IMAGE_VERSION}
          docker push ghcr.io/vanhinthem/parkeren-app:sha-${IMAGE_SHA}
