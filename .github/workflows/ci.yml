name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/Parkeren.Api/**'
              - 'src/Parkeren.Application/**'
              - 'src/Parkeren.Domain/**'
              - 'src/Parkeren.Infrastructure/**'
              - 'src/Parkeren.TwoParkMock/**'
              - 'tests/Parkeren.Application.Tests/**'
              - 'tests/Parkeren.Domain.Tests/**'
              - 'tests/Parkeren.IntegrationTests/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'Directory.Packages.props'
              - 'compose*.yml'
              - 'deploy/compose*.yml'
              - '.github/workflows/**'
            frontend:
              - 'src/Parkeren.Web/**'
              - 'compose*.yml'
              - 'deploy/compose*.yml'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: >-
      always() && (
        needs.changes.outputs.backend == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Parkeren.slnx
      - run: dotnet build Parkeren.slnx --no-restore --configuration Release
      - run: dotnet test Parkeren.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
      - name: Publish backend test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Backend Tests
          path: '**/TestResults/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: false

  frontend:
    needs: changes
    if: >-
      always() && (
        needs.changes.outputs.frontend == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Parkeren.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - name: Build and check production PWA
        env:
          PARKEREN_BUILD_ID: ${{ github.sha }}
          PARKEREN_APP_VARIANT: production
        run: npm run build && npm run check:pwa
      - name: Build and check development PWA
        env:
          PARKEREN_BUILD_ID: ${{ github.sha }}
          PARKEREN_APP_VARIANT: dev
        run: npm run build && npm run check:pwa
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Publish frontend test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Frontend Tests
          path: 'src/Parkeren.Web/test-results.xml'
          reporter: java-junit
          fail-on-error: false

  validate-release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi

  build-development-images:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' && github.base_ref == 'develop')
      ) &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true'
      ) &&
      (
        (needs.changes.outputs.backend != 'true' && needs.backend.result == 'skipped') ||
        needs.backend.result == 'success'
      ) &&
      (
        (needs.changes.outputs.frontend != 'true' && needs.frontend.result == 'skipped') ||
        needs.frontend.result == 'success'
      )
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build development app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.Api/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-app:dev-${{ github.sha }}
            parkeren-app:dev
          build-args: |
            PARKEREN_BUILD_ID=${{ github.sha }}
            PARKEREN_APP_VARIANT=dev
      - name: Build TwoPark mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.TwoParkMock/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-two-park-mock:dev-${{ github.sha }}
            parkeren-two-park-mock:dev
      - name: Verify development image tags
        run: |
          docker image inspect parkeren-app:dev-${GITHUB_SHA}
          docker image inspect parkeren-app:dev
          docker image inspect parkeren-two-park-mock:dev-${GITHUB_SHA}
          docker image inspect parkeren-two-park-mock:dev

  build-release-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Parkeren.Api/Dockerfile
          load: true
          push: false
          tags: |
            parkeren-app:${{ github.ref_name }}
            parkeren-app:sha-${{ github.sha }}
          build-args: |
            PARKEREN_BUILD_ID=${{ github.sha }}
            PARKEREN_APP_VARIANT=production
      - name: Verify release image tags
        run: |
          docker image inspect parkeren-app:${GITHUB_REF_NAME}
          docker image inspect parkeren-app:sha-${GITHUB_SHA}
